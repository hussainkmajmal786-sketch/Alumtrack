; Alumtrack bus tracker — ESP32 + u-blox NEO-6M/NEO-M8N
;
;   pio run                      build
;   pio run -t upload            flash
;   pio device monitor           serial log
;
; Copy src/secrets.example.h to src/secrets.h and fill it in before building.
; secrets.h is gitignored.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0
    bblanchon/ArduinoJson@^7.2.0

; Partition table with OTA slots, so trackers can be updated without
; physically retrieving each bus.
board_build.partitions = default.csv
